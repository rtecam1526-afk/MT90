<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club de referidos</title>
<style>
:root{--bg:#F5F5F7;--card:#FFFFFF;--ink:#16171D;--mut:#5E6170;--line:#E4E5EC;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#101117;--card:#1A1B23;--ink:#F2F3F7;--mut:#A8ABBA;--line:#2A2C38;color-scheme:dark}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:360px;text-align:center}
h1{font-size:18px;margin:0 0 8px}
p{color:var(--mut);font-size:14px;margin:0;line-height:1.5}
</style></head><body>
<div class="card">
  <h1>Este link no está disponible</h1>
  <p>Puede que haya vencido o que ya no esté activo. Si creés que es un error, consultá directamente con tu agente.</p>
</div>
</body></html>
